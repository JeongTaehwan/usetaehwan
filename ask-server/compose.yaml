# 로컬 개발·테스트용 pgvector. 운영은 Neon(같은 확장)을 쓴다.
services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ask
      POSTGRES_PASSWORD: ask
      POSTGRES_DB: ask
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ask"]
      interval: 2s
      retries: 20
