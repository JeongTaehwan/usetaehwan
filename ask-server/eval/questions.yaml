# 평가 질문셋 (design §7.1)
#
# type      single | multi | no_answer | out_of_scope | personal | injection
# expect    answer | no_evidence | refused
# sources   기대 출처. 항목 하나가 "필요한 사실 하나"이고, a|b 는 둘 중 어느 쪽이든 된다는 뜻.
#           doc_id(project:gak) 또는 chunk_id(project:gak#case-2)로 쓴다. chunk_id는 쪼갠 조각(~2)까지 포함한다.
#           hit@k  = 항목 중 하나라도 top-k에 있으면 적중 / recall@k = top-k에 있는 항목의 비율
# numbers   답에 반드시 나와야 하는 숫자 (근거 원문 그대로)
# must_not  답에 나오면 안 되는 문구
# no_answer 질문의 주제는 코퍼스에 없음을 grep으로 확인했다 (2026-10-12: Kubernetes·Kafka·Redis·GraphQL·Swift 0건)

