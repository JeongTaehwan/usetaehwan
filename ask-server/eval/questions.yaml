- id: q12
  type: multi
  question: LLM이 만든 결과를 코드로 검증한 사례를 프로젝트별로 알려줘
  expect: answer
  sources:
    - project:gak|ai:hallucination-control|resume#case-gak
    - project:oneureodi|resume#case-oneureodi
  # 끼니는 넣지 않았다 — 끼니의 검증은 에이전트가 지적하는 방식(project:kkini#case-2)이고, 코드로 검증한 것은
  # 에이전트 보고의 숫자를 grep으로 다시 센 것(ai:agent-team#case-4)이라 "LLM 결과를 코드로 검증"인지 애매하다
  mentions:
      - item: 각(Gak)
        match: ['Gak', '(?<![가-힣])각(?=\(|에서|은|과|의|이 |으로)']
        sources: project:gak#case-2|project:gak#feature-2|resume#case-gak|resume#side-projects~2
      - item: 오늘어디
        match: [오늘어디, Oneureodi]
        sources: project:oneureodi#case-1|project:oneureodi#case-2|project:oneureodi#feature-1|resume#case-oneureodi

