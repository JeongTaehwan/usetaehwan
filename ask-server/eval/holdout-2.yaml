# 홀드아웃 질문셋 2 — 생성 프롬프트 v3 측정(prompt-v3) **전에** 만들어 커밋했다 (2026-10-17, D-35).
#
# eval/holdout.yaml은 tuned 설정으로 이미 한 번 썼다(D-31). 이 파일은 최종 채택 설정으로 마지막에 한 번만 돌린다.
# 조정(프롬프트 문구·k·하한) 중에는 이 파일로 평가를 돌리지 않는다.
# 형식은 questions.yaml과 같다. 기대 출처·기대 항목은 Neon 코퍼스 123청크 본문을 읽고 정했다.
# 기존 질문(q01~q30, h01~h08)과 질문 주제가 겹치지 않게 골랐다. h2-01은 h07과 같은 청크(home#exp-5)지만 다른 사실(i18n)을 묻는다.
# no_answer 주제는 코퍼스에 없음을 확인했다 (2026-10-17: Terraform·테라폼·Rust·러스트 0건).

