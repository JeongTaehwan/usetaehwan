[project]
name = "ask-server"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.13.0",
    "fastapi>=0.143.0",
    "httpx>=0.28.1",
    "langgraph>=1.2.14",
    "psycopg-pool>=3.3.3",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.14.0",
    "pyyaml>=6.0.3",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["db: pgvector가 필요한 테스트 (ASK_TEST_DATABASE_URL, 없으면 건너뜀)"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # 한국어 문서의 전각·특수 기호
